[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttcrawl"
version = "0.5.3"
description = "Read a website into raw material an AI can work from: pages as markdown, an inventory, the header and footer as structure, pictures, structured data, linked documents, imported feeds, a launch check and an audit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["markitdown[pdf,docx,pptx,xlsx]>=0.1"]

[project.scripts]
tt-crawl = "ttcrawl.cli:main"

[tool.setuptools]
packages = ["ttcrawl", "ttcrawl.playbooks"]

[tool.setuptools.package-data]
"ttcrawl.playbooks" = ["*.md"]
